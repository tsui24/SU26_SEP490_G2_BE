spring:
  datasource:
    # RDS test `capstone26-test` đã tắt (2026-08-12) nên dev không còn DB dùng
    # chung. Mặc định trỏ localhost để chạy máy cá nhân không cần cấu hình gì;
    # CI ghi đè DB_URL để trỏ vào MySQL service container của job.
    url: ${DB_URL:jdbc:mysql://localhost:3306/su26_sep490_g2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Máy 1GiB: giữ pool nhỏ để không chiếm hết connection/CPU
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true

# Dev: cho phép mọi origin (React/Vite/Angular/Next trên localhost bất kỳ port)
app:
  cors:
    allowed-origin-patterns:
      - "*"
    allow-credentials: false

logging:
  level:
    com.capstone.su26_sep490_g2_be: DEBUG
    org.springframework.security: DEBUG
