spring:
  datasource:
    url: jdbc:mysql://capstone26-test.c3q2cuga2avz.ap-southeast-1.rds.amazonaws.com:3306/capstone26_g2_test
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # RDS 1GiB: giữ pool nhỏ để không chiếm hết connection/CPU
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.batch_size: 25
      hibernate.order_inserts: true
      hibernate.order_updates: true

# Dev: cho phép mọi origin (React/Vite/Angular/Next trên localhost bất kỳ port)
app:
  cors:
    allowed-origin-patterns:
      - "*"
    allow-credentials: false

logging:
  level:
    com.capstone.su26_sep490_g2_be: DEBUG
    org.springframework.security: DEBUG
