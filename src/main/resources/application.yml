spring:
  application:
    name: SU26_SEP490_G2_BE

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: ${MINIO_MAX_FILE_SIZE_BYTES:5242880}
      max-request-size: ${MINIO_MAX_FILE_SIZE_BYTES:5242880}

  jpa:
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# JWT
app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItZGV2LW9ubHktY2hhbmdlLWluLXByb2Q=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  external-api:
    base-url: ${EXTERNAL_API_BASE_URL:http://localhost:8081}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:sep490-images}
    secure: ${MINIO_SECURE:false}
    default-folder: ${MINIO_DEFAULT_FOLDER:images}
    max-file-size-bytes: ${MINIO_MAX_FILE_SIZE_BYTES:5242880}
    presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:3600}
    connect-timeout-ms: ${MINIO_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${MINIO_READ_TIMEOUT_MS:5000}
    write-timeout-ms: ${MINIO_WRITE_TIMEOUT_MS:5000}
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    api-url: https://api-merchant.payos.vn
    return-url: ${PAYOS_RETURN_URL:http://localhost:3000/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:3000/payment/cancel}
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://localhost:*
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
      - HEAD
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
    allow-credentials: true
    max-age: 3600

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
