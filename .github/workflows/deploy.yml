name: CI/CD Backend

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: ./mvnw test -B

  deploy:
    needs: test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: [self-hosted, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build & restart backend container
        run: |
          docker compose -f /opt/deploy/docker-compose.yml --env-file /opt/deploy/.env up -d --build backend

      - name: Clean up dangling images
        run: docker image prune -f
