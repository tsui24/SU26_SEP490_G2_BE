name: CI/CD Backend

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # MinIO không chạy trong CI — chỉ cần giá trị khác rỗng để MinioClient khởi tạo được,
          # kết nối thật sự thất bại sẽ được bỏ qua (xem MinioConfig#minioBucketInitializer)
          MINIO_ACCESS_KEY: ci-placeholder
          MINIO_SECRET_KEY: ci-placeholder
        run: ./mvnw test -B

  deploy:
    needs: test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: [self-hosted, backend]
    steps:
      - uses: actions/checkout@v4

      # File compose gốc nằm trên EC2 và không được version control. Hai overlay
      # được gộp lên trên nó:
      #   - docker-compose.mysql.yml : database chạy trong Docker thay cho RDS
      #   - docker-compose.dozzle.yml: xem log real-time + xoay vòng log backend
      #
      # ⚠️  KHÔNG được bỏ overlay mysql. Thiếu nó, compose tạo lại backend với
      # biến RDS_* trong docker-compose.yml gốc — ứng dụng vẫn chạy, health check
      # vẫn 200, nhưng đã âm thầm nối về RDS cũ và dữ liệu mới ghi vào đó.
      # Kiểm tra sau mỗi lần deploy:
      #     docker exec deploy-backend-1 printenv DB_URL   # phải là mysql:3306
      #
      # Thứ tự -f quan trọng: file đầu tiên quyết định tên project, nên phải giữ
      # /opt/deploy/docker-compose.yml ở vị trí đầu — đổi chỗ sẽ làm compose coi
      # các container đang chạy là của project khác và bỏ rơi chúng.
      - name: Build & restart backend + dozzle
        run: |
          docker compose \
            -f /opt/deploy/docker-compose.yml \
            -f /opt/deploy/docker-compose.mysql.yml \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.dozzle.yml" \
            --env-file /opt/deploy/.env \
            up -d --build backend dozzle

      - name: Clean up dangling images
        run: docker image prune -f
