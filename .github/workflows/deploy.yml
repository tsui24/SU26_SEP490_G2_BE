name: CI/CD Backend

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # MinIO không chạy trong CI — chỉ cần giá trị khác rỗng để MinioClient khởi tạo được,
          # kết nối thật sự thất bại sẽ được bỏ qua (xem MinioConfig#minioBucketInitializer)
          MINIO_ACCESS_KEY: ci-placeholder
          MINIO_SECRET_KEY: ci-placeholder
        run: ./mvnw test -B

  deploy:
    needs: test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: [self-hosted, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build & restart backend container
        run: |
          docker compose -f /opt/deploy/docker-compose.yml --env-file /opt/deploy/.env up -d --build backend

      - name: Clean up dangling images
        run: docker image prune -f
