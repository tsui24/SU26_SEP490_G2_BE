name: CI/CD Backend

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          # MinIO không chạy trong CI — chỉ cần giá trị khác rỗng để MinioClient khởi tạo được,
          # kết nối thật sự thất bại sẽ được bỏ qua (xem MinioConfig#minioBucketInitializer)
          MINIO_ACCESS_KEY: ci-placeholder
          MINIO_SECRET_KEY: ci-placeholder
        run: ./mvnw test -B

  deploy:
    needs: test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: [self-hosted, backend]
    steps:
      - uses: actions/checkout@v4

      # File compose gốc nằm trên EC2 và không được version control; overlay
      # trong repo bổ sung Dozzle (xem log real-time) + xoay vòng log cho
      # backend. Thứ tự -f quan trọng: file đầu tiên quyết định tên project,
      # nên phải giữ /opt/deploy/docker-compose.yml ở vị trí đầu — đổi chỗ sẽ
      # làm compose coi các container đang chạy là của project khác và bỏ rơi chúng.
      - name: Build & restart backend + dozzle
        run: |
          docker compose \
            -f /opt/deploy/docker-compose.yml \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.dozzle.yml" \
            --env-file /opt/deploy/.env \
            up -d --build backend dozzle

      - name: Clean up dangling images
        run: docker image prune -f
