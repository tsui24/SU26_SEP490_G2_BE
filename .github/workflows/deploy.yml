name: CI/CD Backend

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  test:
    runs-on: ubuntu-latest

    # Su26Sep490G2BeApplicationTests là @SpringBootTest — cần MySQL thật để
    # context khởi động được. Trước đây job này nối tới RDS `capstone26-test`;
    # RDS đã tắt (2026-08-12) nên CI tự dựng MySQL dùng một lần ở đây.
    #
    # ⚠️  KHÔNG trỏ vào MySQL trên EC2. Host `mysql:3306` chỉ phân giải được
    # bên trong docker network của compose, còn trỏ bằng IP public thì phải mở
    # 3306 ra internet và test sẽ chạy ddl-auto + seeder vào dữ liệu thật.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: su26_sep490_g2
        ports:
          - 3306:3306
        # Không có health check thì job chạy tiếp khi MySQL chưa nhận kết nối
        # (container up trước khi server sẵn sàng vài chục giây).
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: dev
          # DB dùng một lần, hủy khi job kết thúc — không cần để trong secrets.
          DB_URL: jdbc:mysql://127.0.0.1:3306/su26_sep490_g2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: root
          DB_PASSWORD: ci-root
          # MinIO không chạy trong CI — chỉ cần giá trị khác rỗng để MinioClient khởi tạo được,
          # kết nối thật sự thất bại sẽ được bỏ qua (xem MinioConfig#minioBucketInitializer)
          MINIO_ACCESS_KEY: ci-placeholder
          MINIO_SECRET_KEY: ci-placeholder
        run: ./mvnw test -B

  deploy:
    needs: test
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: [self-hosted, backend]
    steps:
      - uses: actions/checkout@v4

      # File compose gốc nằm trên EC2 và không được version control. Hai overlay
      # được gộp lên trên nó:
      #   - docker-compose.mysql.yml : database chạy trong Docker thay cho RDS
      #   - docker-compose.dozzle.yml: xem log real-time + xoay vòng log backend
      #
      # ⚠️  KHÔNG được bỏ overlay mysql. Thiếu nó, compose tạo lại backend với
      # biến RDS_* trong docker-compose.yml gốc — ứng dụng vẫn chạy, health check
      # vẫn 200, nhưng đã âm thầm nối về RDS cũ và dữ liệu mới ghi vào đó.
      # Kiểm tra sau mỗi lần deploy:
      #     docker exec deploy-backend-1 printenv DB_URL   # phải là mysql:3306
      #
      # Thứ tự -f quan trọng: file đầu tiên quyết định tên project, nên phải giữ
      # /opt/deploy/docker-compose.yml ở vị trí đầu — đổi chỗ sẽ làm compose coi
      # các container đang chạy là của project khác và bỏ rơi chúng.
      - name: Build & restart backend + dozzle
        run: |
          docker compose \
            -f /opt/deploy/docker-compose.yml \
            -f /opt/deploy/docker-compose.mysql.yml \
            -f "$GITHUB_WORKSPACE/deploy/docker-compose.dozzle.yml" \
            --env-file /opt/deploy/.env \
            up -d --build backend dozzle

      - name: Clean up dangling images
        run: docker image prune -f
